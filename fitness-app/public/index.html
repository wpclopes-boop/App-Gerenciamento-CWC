<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness App — Treino & Dieta</title>
<meta name="description" content="Treinos, dieta, evolução corporal e metas em um só lugar.">
<meta name="theme-color" content="#f5a623">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<link rel="manifest" href="/manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="/icons/icone-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>

<!-- O iPhone nao oferece botao de instalar: o caminho e pelo menu Compartilhar.
     Fica fora de #tela-auth e de #app para valer nas duas telas. -->
<div class="dica-ios hidden" id="dica-ios">
  <span>📲 Para instalar: toque em <b>Compartilhar</b> e escolha <b>Adicionar à Tela de Início</b>.</span>
  <button class="icon-del" id="fechar-dica-ios" aria-label="Fechar">✕</button>
</div>

<!-- ══════════ LOGIN / CADASTRO ══════════ -->
<div class="auth" id="tela-auth">
  <div class="auth-card">
    <div class="auth-logo">💪 FITNESS APP</div>
    <div class="auth-sub" id="auth-sub">Treino, dieta e evolução em um só lugar</div>
    <div class="auth-erro hidden" id="auth-erro"></div>
    <form class="auth-form" id="form-auth">
      <label class="field hidden" id="campo-nome">Nome
        <input type="text" name="nome" autocomplete="name" maxlength="80">
      </label>
      <label class="field">E-mail
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="field">Senha
        <input type="password" name="senha" autocomplete="current-password" minlength="8" required>
      </label>
      <button class="btn btn-primary" type="submit" id="btn-auth">Entrar</button>
    </form>
    <div class="auth-switch">
      <span id="auth-texto">Ainda não tem conta?</span>
      <button type="button" id="btn-trocar-modo">Criar conta</button>
    </div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" class="hidden">
  <div class="nav">
    <div class="nav-inner">
      <div class="nav-brand">💪 FITNESS APP</div>
      <div class="nav-tabs">
        <button class="ntab on" data-secao="painel">📊 Painel</button>
        <button class="ntab" data-secao="dieta">🍽️ Dieta</button>
        <button class="ntab" data-secao="treino">🏋️ Treino</button>
        <button class="ntab" data-secao="progresso">📈 Progresso</button>
        <button class="ntab" data-secao="metas">🎯 Metas</button>
      </div>
      <div class="nav-user">
        <span id="nav-nome"></span>
        <button class="btn btn-sm hidden" id="btn-instalar">📲 Instalar app</button>
        <button class="btn btn-ghost btn-sm" id="btn-sair">Sair</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="section on" id="s-painel"></div>
    <div class="section" id="s-dieta"></div>
    <div class="section" id="s-treino"></div>
    <div class="section" id="s-progresso"></div>
    <div class="section" id="s-metas"></div>
  </div>
</div>

<div id="toasts"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
